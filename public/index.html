<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netsorna - Fine Art & Collectibles</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Reenie+Beanie&family=Great+Vibes&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" type="image/svg+xml" href="images/icons/favicon.svg" />
</head>
<body>

  <!-- Header Navigation -->
  <header class="navbar">
    <button class="menu-btn" aria-label="Open Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a href="index.html" class="brand-logo">
      <img src="images/icons/logo1.svg" alt="Netsorna Logo" class="logo-img" onerror="this.outerHTML='<span class=\'logo-text\'>netsorna.</span>'">
    </a>
    <a href="cart.html" class="cart-btn" aria-label="Shopping Cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
    </a>
  </header>

  <main>
    <!-- Featured Hero Banner Section -->
    <section class="hero-section">
      <div class="hero-bg-overlay"></div>
      
      <div class="featured-card">
        <h2 class="featured-title">Featured<br>Partner</h2>
        
        <div class="featured-content">
          <div class="featured-image-box">
            <img src="images/products/featured-art.jpg" alt="Featured Relief Artwork" onerror="this.src='https://via.placeholder.com/200x200/ddd/333?text=Art+Piece'">
            <a href="product.html" class="btn btn-solid btn-sm">Get One</a>
          </div>
          
          <div class="featured-details">
            <p class="quote">
              "I really love this piece, it reminds me of when i was still young looking at my late granny's walls seeing beautiful pieces like this one."
            </p>
            <span class="signature">Lerato M.</span>
            <div class="action-right">
              <a href="featured.html" class="btn btn-subtle btn-sm">View More</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Browse Grid Section -->
    <section class="browse-section">
      <h1 class="browse-heading">Browse</h1>
      
      <div class="product-grid">
        <!-- Product Card 1 -->
        <div class="product-card">
          <div class="product-image-container">
            <img src="images/products/product1.jpg" alt="FROME ART" class="product-img" onerror="this.outerHTML='<div class=\'placeholder-box\'></div>'">
          </div>
          <div class="product-info">
            <span class="price">R 1999</span>
            <h3 class="product-title">FROME ART</h3>
            <a href="product.html" class="btn btn-outline">Get One</a>
          </div>
        </div>

        <!-- Product Card 2 -->
        <div class="product-card">
          <div class="product-image-container">
            <img src="images/products/product2.jpg" alt="FROME ART" class="product-img" onerror="this.outerHTML='<div class=\'placeholder-box\'></div>'">
          </div>
          <div class="product-info">
            <span class="price">R 1999</span>
            <h3 class="product-title">FROME ART</h3>
            <a href="product.html" class="btn btn-outline">Get One</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
