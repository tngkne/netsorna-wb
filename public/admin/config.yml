backend:
  name: github
  repo: tngkne/netsorna-wb
  branch: main
  base_url: https://netsorna-wb.netsorna.workers.dev
  auth_endpoint: /api/cms-auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SKU", name: "sku", widget: "string" }
      - { label: "Price", name: "price", widget: "number", value_type: "float" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "markdown" }
      - { label: "In Stock", name: "in_stock", widget: "boolean", default: true }
